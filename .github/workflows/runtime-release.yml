name: Native runtime release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag for the runtime archives
        required: true
        type: string
      publish:
        description: Publish archives to the GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

env:
  RUNTIME_REVISION: 4f9676226f667d14608487df744f375db87127f8
  SOURCE_DATE_EPOCH: "0"

jobs:
  cpu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build git curl ca-certificates python3 python3-venv tar zstd
      - name: Restore compiled CPU runtime
        id: restore-cpu-runtime
        uses: actions/cache/restore@v5
        with:
          path: .runtime/release-cpu
          key: speechloom-native-cpu-v1-${{ env.RUNTIME_REVISION }}-${{ hashFiles('scripts/bootstrap_runtime.sh', 'scripts/bootstrap_build_tools.sh') }}
      - name: Install pinned CMake
        if: steps.restore-cpu-runtime.outputs.cache-hit != 'true'
        run: scripts/bootstrap_build_tools.sh --prefix .runtime/tools
      - name: Build CPU runtime
        if: steps.restore-cpu-runtime.outputs.cache-hit != 'true'
        run: |
          export PATH="$PWD/.runtime/tools/bin:$PATH"
          scripts/bootstrap_runtime.sh --backend cpu --prefix .runtime/release-cpu --tools-prefix .runtime/tools
      - name: Save compiled CPU runtime
        if: steps.restore-cpu-runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .runtime/release-cpu
          key: ${{ steps.restore-cpu-runtime.outputs.cache-primary-key }}
      - name: Package CPU runtime
        run: |
          python3 scripts/package_runtime.py \
            --prefix .runtime/release-cpu \
            --output-dir dist-runtime \
            --backend cpu \
            --revision "$RUNTIME_REVISION" \
            --features asr
      - name: Verify CPU runtime archive
        run: python3 scripts/verify_runtime_archive.py dist-runtime/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-cpu
          path: dist-runtime/*

  cuda:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.6.3-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y build-essential ninja-build git curl ca-certificates python3 python3-venv tar zstd
      - name: Restore compiled CUDA runtime
        id: restore-cuda-runtime
        uses: actions/cache/restore@v5
        with:
          path: .runtime/release-cuda
          key: speechloom-native-cuda126-nmt-v1-${{ env.RUNTIME_REVISION }}-${{ hashFiles('scripts/bootstrap_runtime.sh', 'scripts/bootstrap_build_tools.sh') }}
      - name: Install pinned CMake
        if: steps.restore-cuda-runtime.outputs.cache-hit != 'true'
        run: scripts/bootstrap_build_tools.sh --prefix .runtime/tools
      - name: Build CUDA runtime with translation
        if: steps.restore-cuda-runtime.outputs.cache-hit != 'true'
        run: |
          export PATH="$PWD/.runtime/tools/bin:$PATH"
          scripts/bootstrap_runtime.sh \
            --backend cuda \
            --prefix .runtime/release-cuda \
            --tools-prefix .runtime/tools \
            --with-nmt \
            --skip-gpu-check \
            --skip-runtime-check
      - name: Save compiled CUDA runtime
        if: steps.restore-cuda-runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .runtime/release-cuda
          key: ${{ steps.restore-cuda-runtime.outputs.cache-primary-key }}
      - name: Bundle CUDA user-space runtime libraries
        run: |
          python3 scripts/bundle_cuda_runtime.py \
            --prefix .runtime/release-cuda \
            --license /NGC-DL-CONTAINER-LICENSE \
            --license /usr/share/doc/libnccl2/copyright
      - name: Package CUDA runtime
        run: |
          python3 scripts/package_runtime.py \
            --prefix .runtime/release-cuda \
            --output-dir dist-runtime \
            --backend cuda \
            --revision "$RUNTIME_REVISION" \
            --features asr,translation
      - name: Verify CUDA runtime archive
        run: python3 scripts/verify_runtime_archive.py dist-runtime/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-cuda
          path: dist-runtime/*

  release:
    needs: [cpu, cuda, verify]
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-*
          path: dist-runtime
          merge-multiple: true
      - name: Create pinned registry candidate
        run: |
          cp src/speechloom/data/registry.json dist-runtime/registry.json
          python3 scripts/update_runtime_registry.py \
            --registry dist-runtime/registry.json \
            --release-dir dist-runtime \
            --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-release-candidate
          path: dist-runtime/*
      - name: Publish GitHub release assets
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "Speechloom runtime $RELEASE_TAG" --notes "Pinned NeMo-Speech.cpp runtime archives."
          gh release upload "$RELEASE_TAG" dist-runtime/*.tar.gz dist-runtime/*.sha256 --clobber
      - name: Push registry promotion branch
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="runtime-registry-$RELEASE_TAG"
          echo "REGISTRY_BRANCH=$branch" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "$branch"
            existing_registry="$RUNNER_TEMP/existing-runtime-registry.json"
            git show FETCH_HEAD:src/speechloom/data/registry.json > "$existing_registry"
            if ! cmp -s dist-runtime/registry.json "$existing_registry"; then
              echo "::error::Existing promotion branch $branch contains different registry data"
              exit 1
            fi
            echo "Reusing existing registry promotion branch $branch"
          else
            cp dist-runtime/registry.json src/speechloom/data/registry.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git add src/speechloom/data/registry.json
            git commit -m "build: register $RELEASE_TAG runtime archives"
            git push origin "$branch"
          fi
      - name: Open registry promotion pull request
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_url=$(gh pr list \
            --base "$GITHUB_REF_NAME" \
            --head "$REGISTRY_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url')
          if [ -n "$existing_url" ]; then
            echo "Registry promotion pull request already exists: $existing_url"
            exit 0
          fi
          if pr_output=$(gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$REGISTRY_BRANCH" \
            --title "Register $RELEASE_TAG runtime archives" \
            --body "Pins the verified CPU and CUDA archive URLs and checksums produced by the runtime release workflow." 2>&1); then
            echo "$pr_output"
            exit 0
          else
            status=$?
          fi
          case "$pr_output" in
            *"GitHub Actions is not permitted to create or approve pull requests"*)
              manual_url="https://github.com/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...$REGISTRY_BRANCH?expand=1"
              echo "::warning title=Manual registry promotion required::Open $manual_url"
              {
                echo "## Manual registry promotion required"
                echo
                echo "GitHub Actions is not permitted to create pull requests in this repository."
                echo
                echo "[Open the registry promotion pull request]($manual_url)"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "$pr_output" >&2
              exit "$status"
              ;;
          esac

  verify:
    needs: [cpu, cuda]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-*
          path: dist-runtime
          merge-multiple: true
      - name: Verify archives without a compiler or CUDA toolkit
        run: python3 scripts/verify_runtime_archive.py dist-runtime/*.tar.gz

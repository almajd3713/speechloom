name: Publish Python release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      repository:
        description: Publish destination
        type: choice
        required: true
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[api,test]"
      - name: Run release tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Verify tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          python -c "import os, pathlib, tomllib;
          version=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'];
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}'"
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build and validate distributions
        run: |
          python -m build
          python scripts/validate_distribution.py dist/* \
            --checksums dist-checksums/SHA256SUMS
          python -m twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-checksums
          path: dist-checksums/SHA256SUMS
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/speechloom
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.repository == 'pypi')
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/speechloom
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist
      - uses: actions/download-artifact@v6
        with:
          name: python-package-checksums
          path: dist-checksums
      - name: Create source-control release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/* dist-checksums/SHA256SUMS --clobber

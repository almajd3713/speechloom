# Copy to ~/.config/speechloom/config.ini to change defaults. Command-line options and
# SPEECHLOOM_* environment variables override this file.
#
# `speechloom setup` records the engine and model paths in its own state file, so leave
# nemo_speech, model, diar_model, translation_model and device unset unless you want to
# override the managed installation. Relative paths are resolved from the current
# directory, so use absolute paths.
[speechloom]
# output_dir = transcripts
# formats = json,txt,srt,vtt
# workers = 1
# shared_model = true
# keep_audio = false
# resume = true

# Translate every transcript (needs `speechloom setup --features translation`):
# source_language = ru
# translate_to = en

# Overrides for a custom engine or custom models:
# nemo_speech = /path/to/nemo-speech
# model = /path/to/parakeet-tdt-0.6b-v3.q8_0.gguf
# diar_model = /path/to/diar_streaming_sortformer_4spk-v2.q8_0.gguf
# translation_model = /path/to/riva-translate-4b-instruct-v2.q8_0.gguf
# device = cuda
# ffmpeg = ffmpeg
# ffprobe = ffprobe

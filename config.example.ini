[parakeet-transcribe]
ffmpeg = ffmpeg
ffprobe = ffprobe
nemo_speech = .runtime/nemo-speech/bin/nemo-speech
model = .runtime/models/parakeet-tdt-0.6b-v3.q8_0.gguf
# Uncomment all three settings to translate the transcript and subtitles.
# translation_model = .runtime/models/riva-translate-4b-instruct-v2.q8_0.gguf
# source_language = ru
# translate_to = en
device = cpu
output_dir = transcripts
workers = 1
shared_model = true
keep_audio = false
resume = true
formats = json,txt,srt,vtt

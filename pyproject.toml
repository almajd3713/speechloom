[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "speechloom"
version = "0.1.2"
description = "Offline audio and video transcription with Parakeet TDT and NeMo-Speech.cpp"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "almajd3713" }]
keywords = ["speech-to-text", "transcription", "asr", "subtitles", "srt", "webvtt", "parakeet", "nemo", "cuda", "offline"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/almajd3/speechloom"
Documentation = "https://github.com/almajd3/speechloom/tree/main/docs"
Changelog = "https://github.com/almajd3/speechloom/blob/main/CHANGELOG.md"
Issues = "https://github.com/almajd3/speechloom/issues"

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
]
test = ["httpx2>=2.12,<3"]

[project.scripts]
speechloom = "speechloom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speechloom = ["data/*.json", "py.typed", "web/*", "web/**/*"]

[tool.setuptools.data-files]
"share/speechloom/scripts" = ["scripts/*.sh"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["speechloom"]
lines-after-imports = 2

[tool.mypy]
python_version = "3.10"
files = ["src/speechloom"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "speechloom"
version = "0.1.1"
description = "Reliable local audio and video transcription with NeMo-Speech.cpp"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Speechloom contributors" }]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/almajd3713/speechloom"
Issues = "https://github.com/almajd3713/speechloom/issues"

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
]
test = ["httpx2>=2.12,<3"]

[project.scripts]
speechloom = "speechloom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speechloom = ["data/*.json", "py.typed"]

[tool.setuptools.data-files]
"share/speechloom/scripts" = ["scripts/*.sh"]

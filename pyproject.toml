[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speechloom"
version = "0.1.0"
description = "Reliable local audio and video transcription with NeMo-Speech.cpp"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Speechloom contributors" }]
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
]
test = ["httpx2>=2.12,<3"]

[project.scripts]
speechloom = "speechloom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speechloom = ["data/*.json"]

[tool.setuptools.data-files]
"share/speechloom/scripts" = ["scripts/*.sh"]
